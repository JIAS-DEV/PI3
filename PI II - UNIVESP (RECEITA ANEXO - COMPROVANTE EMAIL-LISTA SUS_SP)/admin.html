<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Painel Administrativo - Doação de Medicamentos</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div class="header text-center mb-4">
    <div class="logo-container mb-2">
      <img src="LOGO_MEDICA.png" alt="Logo do Programa de Doação de Medicamentos"
           style="width: 150px; height: auto;" />
    </div>
    <h1>Painel Administrativo</h1>
    <hr />
  </div>

  <div class="d-flex justify-content-end mb-3">
    <button id="btnLimpar" class="btn btn-outline-danger">Limpar Tudo</button>
  </div>

  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>#</th>
          <th>Nome</th>
          <th>Endereço</th>
          <th>Número</th>
          <th>Telefone</th>
          <th>Medicamento</th>
          <th>Quantidade</th>
          <th>Renda</th>
          <th>Arquivo PDF</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
  </div>

  <script>
    const DB_NAME = 'DoacaoDB';
    const DB_VERSION = 1;
    const STORE = 'cadastros';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE)) {
            db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
      });
    }

    async function obterTodos() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const store = tx.objectStore(STORE);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function apagar(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        const store = tx.objectStore(STORE);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function clearAll() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        const store = tx.objectStore(STORE);
        const req = store.clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function formatMoney(val) {
      if (!val) return '-';
      return 'R$ ' + val;
    }

    async function atualizarTabela() {
      const tabela = document.getElementById('corpoTabela');
      const itens = await obterTodos();
      if (!itens.length) {
        tabela.innerHTML = `<tr><td colspan="10" class="text-center">Nenhum cadastro encontrado.</td></tr>`;
        return;
      }

      tabela.innerHTML = '';
      itens.forEach((item, idx) => {
        const tr = document.createElement('tr');

        let pdfLinkHtml = '-';
        if (item.file) {
          const url = URL.createObjectURL(item.file);
          pdfLinkHtml = `<a href="${url}" target="_blank" download="${item.file.name || 'comprovante.pdf'}" class="btn btn-sm btn-secondary">Ver PDF</a>`;
        }

        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${item.nome || '-'}</td>
          <td>${item.endereco || '-'}</td>
          <td>${item.numero || '-'}</td>
          <td>${item.telefone || '-'}</td>
          <td>${item.medicamento || '-'}</td>
          <td>${item.quantidade || '-'}</td>
          <td>${formatMoney(item.renda)}</td>
          <td>${pdfLinkHtml}</td>
          <td>
            <button class="btn btn-sm btn-danger btn-excluir">Excluir</button>
          </td>
        `;

        tr.querySelector('.btn-excluir').addEventListener('click', async () => {
          if (!confirm('Deseja realmente excluir este registro?')) return;
          await apagar(item.id);
          atualizarTabela();
        });

        tabela.appendChild(tr);
      });
    }

    document.addEventListener('DOMContentLoaded', atualizarTabela);
    document.getElementById('btnLimpar').addEventListener('click', async () => {
      if (!confirm('Apagar todos os cadastros?')) return;
      await clearAll();
      atualizarTabela();
    });
  </script>
</body>
</html>
